<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسجيل الدخول | أرض الأحياء</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px 25px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .logo {
      text-align: center;
      font-size: 45px;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      color: #075e4d;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 17px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #075e4d;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #075e4d;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #064d40;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .register {
      text-align: center;
      margin-top: 20px;
    }

    .register a {
      color: #075e4d;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
</head>

<body>

  <div class="login-box">

    <div class="logo">🧬</div>

    <h1>أرض الأحياء</h1>

    <p class="subtitle">
      تسجيل الدخول إلى حسابك
    </p>

    <form id="loginForm">

      <label for="email">البريد الإلكتروني</label>

      <input
        type="email"
        id="email"
        placeholder="example@email.com"
        required
      >

      <label for="password">كلمة المرور</label>

      <input
        type="password"
        id="password"
        placeholder="أدخل كلمة المرور"
        required
      >

      <button type="submit">
        🔐 تسجيل الدخول
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="register">
      ليس لديك حساب؟
      <a href="register.html">إنشاء حساب جديد</a>
    </div>

  </div>

</body>
</html>
