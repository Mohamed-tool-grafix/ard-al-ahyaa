<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسجيل الدخول | أرض الأحياء</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 35px 25px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.12);
    }

    .logo {
      text-align: center;
      font-size: 48px;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      color: #075e4d;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 17px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #075e4d;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #075e4d;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #064d40;
    }

    button:disabled {
      opacity: 0.6;
    }

    .message {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
      line-height: 1.7;
    }

    .register {
      text-align: center;
      margin-top: 22px;
      color: #555;
    }

    .register a {
      color: #075e4d;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">🧬</div>

    <h1>أرض الأحياء</h1>

    <p class="subtitle">
      تسجيل الدخول إلى حسابك
    </p>

    <form id="loginForm">

      <label for="email">البريد الإلكتروني</label>

      <input
        type="email"
        id="email"
        placeholder="example@email.com"
        autocomplete="email"
        required
      >

      <label for="password">كلمة المرور</label>

      <input
        type="password"
        id="password"
        placeholder="اكتب كلمة المرور"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        🔐 تسجيل الدخول
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="register">
      ليس لديك حساب؟
      <a href="register.html">إنشاء حساب جديد</a>
    </div>

  </div>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://gvehygqxjqucxwussaye.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_0Hxtm1KuZQ7paMyZQwRLQQ_NQ2wRaRX";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const loginForm =
      document.getElementById("loginForm");

    const message =
      document.getElementById("message");

    const loginButton =
      document.getElementById("loginButton");


    loginForm.addEventListener(
      "submit",
      async function(e) {

        e.preventDefault();

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;


        message.textContent =
          "⏳ جاري تسجيل الدخول...";

        loginButton.disabled = true;


        try {

          const { data, error } =
            await supabaseClient.auth.signInWithPassword({

              email: email,

              password: password

            });


          if (error) {

            message.textContent =
              "❌ " + error.message;

            loginButton.disabled = false;

            return;
          }


          message.textContent =
            "✅ تم تسجيل الدخول بنجاح";


          setTimeout(function() {

            window.location.href = "../index.html";

          }, 1000);


        } catch(error) {

          message.textContent =
            "❌ حدث خطأ في الاتصال";

          loginButton.disabled = false;

          console.error(error);

        }

      }
    );

  </script>

</body>
</html>
