<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>المنتدى | منصة أرض الأحياء</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #172033;
    }

    /* ================= الهيدر ================= */

    header {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      height: 70px;

      background: #0f766e;
      color: white;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 25px;

      z-index: 1000;

      box-shadow: 0 3px 12px rgba(0,0,0,.15);
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .header-user {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .student-name {
      background: rgba(255,255,255,.15);
      padding: 9px 14px;
      border-radius: 20px;
      font-size: 15px;
    }

    .logout-btn {
      background: #b91c1c;
      color: white;

      border: none;
      border-radius: 10px;

      padding: 9px 13px;

      cursor: pointer;
      font-size: 14px;
    }

    /* ================= القائمة ================= */

    .sidebar {
      position: fixed;

      top: 70px;
      right: 0;

      width: 230px;
      height: calc(100vh - 70px);

      background: #123b3a;

      padding: 20px 12px;
    }

    .sidebar a {
      display: block;

      text-decoration: none;

      color: white;

      padding: 14px;

      margin-bottom: 8px;

      border-radius: 10px;

      transition: .2s;
    }

    .sidebar a:hover,
    .sidebar a.active {
      background: #0f766e;
    }

    .sidebar-logout {
      position: absolute;

      bottom: 20px;

      right: 12px;
      left: 12px;

      width: calc(100% - 24px);

      padding: 12px;

      border: none;

      border-radius: 10px;

      background: #b91c1c;

      color: white;

      cursor: pointer;

      font-size: 15px;
    }

    /* ================= المحتوى ================= */

    main {
      margin-right: 230px;

      padding: 100px 30px 40px;

      max-width: 1100px;
    }

    .page-title {
      background: white;

      padding: 25px;

      border-radius: 18px;

      margin-bottom: 20px;

      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    .page-title h1 {
      color: #0f766e;

      margin-bottom: 8px;
    }

    .page-title p {
      color: #777;

      line-height: 1.7;
    }

    /* ================= صندوق كتابة المنشور ================= */

    .write-box {
      background: white;

      padding: 25px;

      border-radius: 18px;

      margin-bottom: 25px;

      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    .write-box h2 {
      color: #0f766e;

      margin-bottom: 15px;

      font-size: 20px;
    }

    #postContent {
      width: 100%;

      min-height: 130px;

      resize: vertical;

      border: 1px solid #ddd;

      border-radius: 12px;

      padding: 15px;

      font-size: 16px;

      outline: none;
    }

    #postContent:focus {
      border-color: #0f766e;
    }

    .post-btn {
      margin-top: 12px;

      background: #0f766e;

      color: white;

      border: none;

      border-radius: 10px;

      padding: 12px 22px;

      cursor: pointer;

      font-size: 16px;
    }

    .post-btn:hover {
      background: #0b5f59;
    }

    #message {
      margin-top: 12px;

      color: #d32f2f;
    }

    /* ================= المنشورات ================= */

    .posts-title {
      margin-bottom: 15px;

      color: #172033;
    }

    .post {
      background: white;

      padding: 20px;

      border-radius: 16px;

      margin-bottom: 15px;

      box-shadow: 0 5px 18px rgba(0,0,0,.06);
    }

    .post-header {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 12px;
    }

    .author {
      font-weight: bold;

      color: #0f766e;
    }

    .date {
      color: #999;

      font-size: 13px;
    }

    .post-content {
      white-space: pre-wrap;

      line-height: 1.8;

      color: #333;

      font-size: 16px;
    }

    .delete-btn {
      margin-top: 12px;

      background: #f3f4f6;

      border: none;

      color: #b91c1c;

      padding: 7px 12px;

      border-radius: 8px;

      cursor: pointer;
    }

    .empty {
      background: white;

      padding: 35px;

      border-radius: 16px;

      text-align: center;

      color: #777;
    }

    .loading {
      text-align: center;

      color: #777;

      padding: 20px;
    }

    /* ================= الموبايل ================= */

    @media (max-width: 700px) {

      header {
        padding: 0 10px;
      }

      .logo {
        font-size: 16px;
      }

      .student-name {
        font-size: 12px;

        padding: 7px 9px;
      }

      .logout-btn {
        font-size: 12px;

        padding: 7px 9px;
      }

      .sidebar {
        width: 72px;
      }

      .sidebar a {
        font-size: 0;

        text-align: center;

        padding: 15px 5px;
      }

      .sidebar a::first-letter {
        font-size: 22px;
      }

      .sidebar-logout {
        font-size: 0;

        padding: 13px 5px;
      }

      .sidebar-logout::before {
        content: "🚪";

        font-size: 20px;
      }

      main {
        margin-right: 72px;

        padding: 90px 15px 30px;
      }

      .post-header {
        display: block;
      }

      .date {
        display: block;

        margin-top: 5px;
      }

    }

  </style>
</head>

<body>

  <!-- ================= الهيدر ================= -->

  <header>

    <div class="logo">
      🧬 منصة أرض الأحياء
    </div>

    <div class="header-user">

      <div class="student-name">

        👤
        <span id="studentName">
          الطالب
        </span>

      </div>

      <button
        class="logout-btn"
        onclick="logout()"
      >
        🚪 خروج
      </button>

    </div>

  </header>


  <!-- ================= القائمة ================= -->

  <aside class="sidebar">

    <a href="../index.html">
      🏠 الرئيسية
    </a>

    <a href="../videos/index.html">
      🎥 الفيديوهات
    </a>

    <a
      href="index.html"
      class="active"
    >
      💬 المنتدى
    </a>

    <a href="../notes/index.html">
      📚 المذكرات
    </a>

    <button
      class="sidebar-logout"
      onclick="logout()"
    >
      🚪 تسجيل الخروج
    </button>

  </aside>


  <!-- ================= المحتوى ================= -->

  <main>

    <section class="page-title">

      <h1>
        💬 منتدى أرض الأحياء
      </h1>

      <p>
        اطرح سؤالك أو شارك معلومة مفيدة مع باقي الطلاب.
      </p>

    </section>


    <!-- كتابة منشور -->

    <section class="write-box">

      <h2>
        ✏️ اكتب منشورًا جديدًا
      </h2>

      <textarea
        id="postContent"
        placeholder="اكتب سؤالك أو منشورك هنا..."
      ></textarea>

      <button
        class="post-btn"
        onclick="addPost()"
      >
        نشر المنشور
      </button>

      <div id="message"></div>

    </section>


    <!-- المنشورات -->

    <h2 class="posts-title">
      📢 أحدث المنشورات
    </h2>

    <div id="posts">

      <div class="loading">
        جاري تحميل المنشورات...
      </div>

    </div>

  </main>


  <!-- ================= JavaScript ================= -->

  <script>

    /* ================= Supabase ================= */

    const SUPABASE_URL =
      "https://gvehygqxjqucxwussaye.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_0Hxtm1KuZQ7paMyZQwRLQQ_NQ2wRaRX";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    let currentUser = null;


    /* ================= تشغيل الصفحة ================= */

    async function startForum() {

      const { data, error } =
        await supabaseClient.auth.getUser();


      if (error || !data.user) {

        window.location.href =
          "../index.html";

        return;
      }


      currentUser =
        data.user;


      const name =
        currentUser.user_metadata?.name ||

        currentUser.user_metadata?.full_name ||

        currentUser.email?.split("@")[0] ||

        "الطالب";


      document
        .getElementById("studentName")
        .textContent = name;


      loadPosts();

    }


    /* ================= تحميل المنشورات ================= */

    async function loadPosts() {

      const postsContainer =
        document.getElementById("posts");


      postsContainer.innerHTML =
        '<div class="loading">جاري تحميل المنشورات...</div>';


      const { data, error } =
        await supabaseClient

          .from("forum_posts")

          .select("*")

          .order("created_at", {
            ascending: false
          });


      if (error) {

        postsContainer.innerHTML =
          '<div class="empty">حدث خطأ أثناء تحميل المنشورات.</div>';

        console.error(error);

        return;
      }


      if (!data || data.length === 0) {

        postsContainer.innerHTML = `
          <div class="empty">
            💬 لا توجد منشورات حتى الآن.<br>
            كن أول طالب يكتب منشورًا!
          </div>
        `;

        return;
      }


      postsContainer.innerHTML = "";


      data.forEach(post => {

        const postElement =
          document.createElement("article");


        postElement.className =
          "post";


        const date =
          new Date(
            post.created_at
          ).toLocaleString(
            "ar-EG"
          );


        let deleteButton = "";


        if (
          currentUser &&
          post.user_id === currentUser.id
        ) {

          deleteButton = `
            <button
              class="delete-btn"
              onclick="deletePost(${post.id})"
            >
              🗑️ حذف المنشور
            </button>
          `;

        }


        postElement.innerHTML = `

          <div class="post-header">

            <div class="author">
              👤 ${escapeHtml(post.author_name)}
            </div>

            <div class="date">
              ${date}
            </div>

          </div>

          <div class="post-content">
            ${escapeHtml(post.content)}
          </div>

          ${deleteButton}

        `;


        postsContainer.appendChild(
          postElement
        );

      });

    }


    /* ================= إضافة منشور ================= */

    async function addPost() {

      const textarea =
        document.getElementById(
          "postContent"
        );


      const message =
        document.getElementById(
          "message"
        );


      const content =
        textarea.value.trim();


      if (!content) {

        message.style.color =
          "#d32f2f";

        message.textContent =
          "اكتب المنشور أولاً.";

        return;
      }


      if (!currentUser) {

        message.textContent =
          "يجب تسجيل الدخول أولاً.";

        return;
      }


      const name =
        currentUser.user_metadata?.name ||

        currentUser.user_metadata?.full_name ||

        currentUser.email?.split("@")[0] ||

        "الطالب";


      message.style.color =
        "#777";

      message.textContent =
        "جاري نشر المنشور...";


      const { error } =
        await supabaseClient

          .from("forum_posts")

          .insert({

            user_id:
              currentUser.id,

            author_name:
              name,

            content:
              content

          });


      if (error) {

        message.style.color =
          "#d32f2f";

        message.textContent =
          "حدث خطأ أثناء نشر المنشور.";

        console.error(error);

        return;
      }


      textarea.value = "";

      message.style.color =
        "#16803c";

      message.textContent =
        "تم نشر المنشور بنجاح ✅";


      loadPosts();

    }


    /* ================= حذف منشور ================= */

    async function deletePost(id) {

      const confirmDelete =
        confirm(
          "هل تريد حذف هذا المنشور؟"
        );


      if (!confirmDelete) {
        return;
      }


      const { error } =
        await supabaseClient

          .from("forum_posts")

          .delete()

          .eq("id", id);


      if (error) {

        alert(
          "حدث خطأ أثناء حذف المنشور."
        );

        console.error(error);

        return;
      }


      loadPosts();

    }


    /* ================= تسجيل الخروج ================= */

    async function logout() {

      await supabaseClient.auth.signOut();

      window.location.href =
        "../index.html";

    }


    /* ================= حماية النص ================= */

    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent =
        text;

      return div.innerHTML;

    }


    /* ================= بدء المنتدى ================= */

    startForum();

  </script>

</body>
</html>
