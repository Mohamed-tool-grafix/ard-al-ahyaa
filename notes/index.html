<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>المذكرات | منصة أرض الأحياء</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #123c69;
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .student {
      font-size: 14px;
    }

    .layout {
      display: flex;
      min-height: calc(100vh - 70px);
    }

    aside {
      width: 230px;
      background: white;
      border-left: 1px solid #ddd;
      padding: 20px 12px;
    }

    aside a {
      display: block;
      text-decoration: none;
      color: #172033;
      padding: 13px;
      margin-bottom: 8px;
      border-radius: 10px;
      font-weight: bold;
    }

    aside a:hover,
    aside a.active {
      background: #e8f1ff;
      color: #1261a0;
    }

    main {
      flex: 1;
      padding: 25px;
    }

    .title {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #667085;
      margin-bottom: 25px;
    }

    .search {
      width: 100%;
      max-width: 600px;
      padding: 14px;
      border: 1px solid #ccd3df;
      border-radius: 12px;
      margin-bottom: 25px;
      font-size: 16px;
      outline: none;
    }

    .search:focus {
      border-color: #1261a0;
    }

    .notes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 18px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .card h3 {
      margin: 8px 0;
    }

    .card p {
      color: #667085;
      min-height: 45px;
    }

    .open {
      display: inline-block;
      background: #1261a0;
      color: white;
      text-decoration: none;
      padding: 11px 18px;
      border-radius: 10px;
      margin-top: 10px;
    }

    .open:hover {
      background: #0d4d82;
    }

    .loading,
    .empty,
    .error {
      background: white;
      padding: 25px;
      border-radius: 14px;
      text-align: center;
      margin-top: 20px;
    }

    .error {
      color: #b42318;
    }

    @media (max-width: 700px) {
      .layout {
        display: block;
      }

      aside {
        width: 100%;
        border-left: none;
        border-bottom: 1px solid #ddd;
      }

      aside a {
        display: inline-block;
        margin: 4px;
      }

      main {
        padding: 18px;
      }

      .title {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">🧬 منصة أرض الأحياء</div>
  <div class="student" id="studentName">جاري التحميل...</div>
</header>

<div class="layout">

  <aside>
    <a href="../index.html">🏠 الرئيسية</a>
    <a href="../videos/index.html">🎥 الفيديوهات</a>
    <a href="#" class="active">📚 المذكرات</a>
    <a href="#" onclick="return false;">💬 المنتدى</a>
  </aside>

  <main>

    <h1 class="title">📚 المذكرات</h1>

    <p class="subtitle">
      المذكرات والملفات التعليمية التي يتم رفعها من لوحة الإدارة.
    </p>

    <input
      type="text"
      id="search"
      class="search"
      placeholder="🔎 ابحث عن مذكرة..."
    >

    <div id="status" class="loading">
      جاري تحميل المذكرات...
    </div>

    <div id="notes" class="notes"></div>

  </main>
</div>

<script>

const SUPABASE_URL =
  "https://gvehygqxjqucxwussaye.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_0Hxtm1KuZQ7paMyZQwRLQQ_NQ2wRaRX";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

let allNotes = [];


/* =========================
   التحقق من تسجيل الدخول
========================= */

async function checkUser() {

  const { data } = await supabaseClient.auth.getUser();

  if (!data.user) {
    window.location.href = "../index.html";
    return null;
  }

  const user = data.user;

  const name =
    user.user_metadata?.name ||
    user.user_metadata?.full_name ||
    user.user_metadata?.username ||
    user.email?.split("@")[0] ||
    "الطالب";

  document.getElementById("studentName").textContent =
    "👤 " + name;

  return user;
}


/* =========================
   تحميل المذكرات
========================= */

async function loadNotes() {

  const status = document.getElementById("status");
  const notesContainer = document.getElementById("notes");

  const { data, error } = await supabaseClient
    .from("content")
    .select("*")
    .eq("type", "pdf")
    .order("created_at", { ascending: false });

  if (error) {

    console.error(error);

    status.className = "error";

    status.textContent =
      "حدث خطأ أثناء تحميل المذكرات.";

    return;
  }

  allNotes = data || [];

  renderNotes(allNotes);
}


/* =========================
   عرض المذكرات
========================= */

function renderNotes(notes) {

  const status = document.getElementById("status");
  const container = document.getElementById("notes");

  container.innerHTML = "";

  if (!notes.length) {

    status.style.display = "block";
    status.className = "empty";

    status.textContent =
      "📚 لا توجد مذكرات حتى الآن.";

    return;
  }

  status.style.display = "none";

  notes.forEach(note => {

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `

      <div class="icon">📄</div>

      <h3>${escapeHTML(note.title || "مذكرة أحياء")}</h3>

      <p>
        ${escapeHTML(
          note.description ||
          "مذكرة تعليمية من منصة أرض الأحياء."
        )}
      </p>

      <a
        class="open"
        href="${note.file_url}"
        target="_blank"
        rel="noopener noreferrer"
      >
        📖 فتح المذكرة
      </a>

    `;

    container.appendChild(card);

  });
}


/* =========================
   البحث
========================= */

document.getElementById("search")
.addEventListener("input", function() {

  const value =
    this.value.trim().toLowerCase();

  if (!value) {

    renderNotes(allNotes);
    return;
  }

  const filtered =
    allNotes.filter(note => {

      const title =
        (note.title || "").toLowerCase();

      const description =
        (note.description || "").toLowerCase();

      return (
        title.includes(value) ||
        description.includes(value)
      );

    });

  renderNotes(filtered);

});


/* =========================
   حماية النصوص
========================= */

function escapeHTML(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================
   تشغيل الصفحة
========================= */

(async function() {

  const user = await checkUser();

  if (!user) return;

  await loadNotes();

})();

</script>

</body>
</html>
