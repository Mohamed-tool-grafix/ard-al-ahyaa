<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>منتدى أحياء ثالثة ثانوي | منصة أرض الأحياء</title>

  <meta name="description"
        content="منتدى منصة أرض الأحياء لطلاب الصف الثالث الثانوي لمشاركة الأسئلة والمناقشات والصور التعليمية.">

  <meta name="keywords"
        content="منتدى أحياء ثالثة ثانوي, أسئلة أحياء, مناقشات أحياء, منصة أرض الأحياء">

  <link rel="icon" href="../favicon.png">
  <link rel="stylesheet" href="../style.css">

  <style>

    .forum-page {
      max-width: 1050px;
      margin: auto;
      padding: 25px 0 60px;
    }

    .forum-hero {
      background: linear-gradient(135deg, #087f55, #056344);
      color: white;
      border-radius: 24px;
      padding: 35px;
      margin-bottom: 25px;
      box-shadow: 0 15px 40px rgba(8,127,85,.18);
    }

    .forum-hero h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    .forum-hero p {
      margin: 0;
      opacity: .92;
      line-height: 1.8;
    }

    .create-post {
      background: var(--white, #fff);
      border: 1px solid var(--border, #e5ece8);
      border-radius: 22px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: var(--shadow, 0 10px 35px rgba(20,70,50,.08));
    }

    .create-post h2 {
      margin-top: 0;
      color: var(--text, #17221d);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .user-avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #e8f7f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .user-info strong {
      color: var(--text, #17221d);
    }

    .post-input {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      border: 1px solid var(--border, #e5ece8);
      border-radius: 15px;
      padding: 15px;
      font-family: inherit;
      font-size: 16px;
      outline: none;
      box-sizing: border-box;
      background: var(--white, #fff);
      color: var(--text, #17221d);
    }

    .post-input:focus {
      border-color: #087f55;
      box-shadow: 0 0 0 3px rgba(8,127,85,.08);
    }

    .post-tools {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .image-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #087f55;
      color: #087f55;
      background: #e8f7f0;
      padding: 11px 17px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    .image-btn:hover {
      background: #d9f2e7;
    }

    #imageInput {
      display: none;
    }

    .publish-btn {
      margin-right: auto;
      border: none;
      background: linear-gradient(135deg, #087f55, #056344);
      color: white;
      padding: 12px 25px;
      border-radius: 12px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      font-size: 15px;
    }

    .publish-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .image-preview {
      display: none;
      margin-top: 15px;
      position: relative;
      width: fit-content;
    }

    .image-preview img {
      width: 220px;
      max-height: 220px;
      object-fit: cover;
      border-radius: 15px;
      border: 1px solid var(--border, #e5ece8);
    }

    .remove-preview {
      position: absolute;
      top: 7px;
      left: 7px;
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 50%;
      background: #d64545;
      color: white;
      cursor: pointer;
      font-size: 17px;
    }

    .message {
      display: none;
      padding: 12px 15px;
      border-radius: 12px;
      margin-top: 15px;
      line-height: 1.6;
    }

    .message.success {
      display: block;
      background: #e8f7f0;
      color: #056344;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #b33131;
    }

    .posts-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .posts-title h2 {
      color: var(--text, #17221d);
      margin: 0;
    }

    .posts-container {
      display: grid;
      gap: 18px;
    }

    .post-card {
      background: var(--white, #fff);
      border: 1px solid var(--border, #e5ece8);
      border-radius: 20px;
      padding: 22px;
      box-shadow: var(--shadow, 0 10px 35px rgba(20,70,50,.08));
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
    }

    .post-avatar {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      background: #e8f7f0;
      color: #087f55;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .post-author {
      font-weight: bold;
      color: var(--text, #17221d);
    }

    .post-date {
      color: var(--muted, #718078);
      font-size: 13px;
      margin-top: 3px;
    }

    .post-content {
      color: var(--text, #17221d);
      line-height: 1.9;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .post-image {
      width: 100%;
      max-width: 650px;
      max-height: 500px;
      object-fit: contain;
      display: block;
      margin-top: 15px;
      border-radius: 16px;
      border: 1px solid var(--border, #e5ece8);
      background: #f5f8f7;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: var(--muted, #718078);
    }

    .empty-posts {
      text-align: center;
      padding: 45px 20px;
      background: var(--white, #fff);
      border: 1px dashed var(--border, #e5ece8);
      border-radius: 20px;
      color: var(--muted, #718078);
    }

    .login-required {
      text-align: center;
      background: #fff8e8;
      border: 1px solid #ecd49b;
      color: #806000;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 20px;
    }

    .login-required a {
      color: #087f55;
      font-weight: bold;
    }

    @media (max-width: 700px) {

      .forum-page {
        padding: 15px 10px 40px;
      }

      .forum-hero {
        padding: 25px 18px;
      }

      .forum-hero h1 {
        font-size: 25px;
      }

      .create-post,
      .post-card {
        padding: 18px;
      }

      .publish-btn {
        width: 100%;
        margin-right: 0;
      }

      .post-tools {
        flex-direction: column;
        align-items: stretch;
      }

      .image-btn {
        justify-content: center;
      }

    }

  </style>
</head>


<body>

  <!-- الشريط العلوي -->
  <header class="topbar">

    <div class="topbar-right">

      <button class="menu-btn"
              onclick="toggleForumSidebar()">
        ☰
      </button>

      <a href="../index.html" class="brand">
        <img src="../logo.png" alt="منصة أرض الأحياء">
        <span>منصة أرض الأحياء</span>
      </a>

    </div>

    <div class="topbar-left">

      <button onclick="toggleDarkMode()"
              class="icon-btn"
              title="الوضع الليلي">
        🌙
      </button>

    </div>

  </header>


  <!-- القائمة الجانبية -->
  <aside class="sidebar" id="forumSidebar">

    <div class="sidebar-logo">

      <img src="../logo.png" alt="منصة أرض الأحياء">

      <h3>أرض الأحياء</h3>

      <span>أحياء ثالثة ثانوي</span>

    </div>


    <nav>

      <a href="../index.html">
        🏠
        <span>الرئيسية</span>
      </a>

      <a href="../videos/index.html">
        🎥
        <span>الدروس</span>
      </a>

      <a href="../notes/index.html">
        📚
        <span>المذكرات</span>
      </a>

      <a href="../exams/index.html">
        📝
        <span>الاختبارات</span>
      </a>

      <a href="index.html" class="active">
        💬
        <span>المنتدى</span>
      </a>

    </nav>

  </aside>


  <!-- المحتوى -->
  <main class="main-content">

    <div class="forum-page">


      <!-- مقدمة المنتدى -->
      <section class="forum-hero">

        <h1>💬 منتدى أرض الأحياء</h1>

        <p>
          مساحة لطلاب ثالثة ثانوي لمشاركة الأسئلة والمناقشات
          والصور التعليمية والاستفادة من بعضهم.
        </p>

      </section>


      <!-- منطقة إنشاء منشور -->
      <section class="create-post">

        <h2>✍️ اكتب منشورًا</h2>


        <div class="user-info">

          <div class="user-avatar">
            👤
          </div>

          <div>
            <strong id="currentUser">
              جاري التحقق...
            </strong>
          </div>

        </div>


        <textarea
          id="postText"
          class="post-input"
          placeholder="اكتب سؤالك أو شارك معلومة مع طلاب ثالثة ثانوي..."
          maxlength="3000"></textarea>


        <!-- معاينة الصورة -->
        <div class="image-preview" id="imagePreview">

          <img id="previewImage" src="" alt="معاينة الصورة">

          <button
            type="button"
            class="remove-preview"
            onclick="removeSelectedImage()">
            ×
          </button>

        </div>


        <div class="post-tools">

          <label for="imageInput" class="image-btn">
            🖼️ إضافة صورة
          </label>

          <input
            type="file"
            id="imageInput"
            accept="image/jpeg,image/png,image/webp,image/gif">

          <button
            type="button"
            class="publish-btn"
            id="publishBtn"
            onclick="publishPost()">

            نشر المنشور 🚀

          </button>

        </div>


        <div id="message" class="message"></div>

      </section>


      <!-- المنشورات -->
      <div class="posts-title">

        <h2>📢 أحدث المنشورات</h2>

      </div>


      <section id="postsContainer"
               class="posts-container">

        <div class="loading">
          جاري تحميل المنشورات...
        </div>

      </section>


    </div>

  </main>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /* =========================================
       إعداد Supabase
    ========================================= */

    const SUPABASE_URL =
      "https://gvehygqxjqucxwussaye.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_0Hxtm1KuZQ7paMyZQwRLQQ_NQ2wRaRX";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );


    /* اسم Bucket الصور */
    const IMAGE_BUCKET = "forum-images";


    let currentUser = null;
    let selectedImage = null;


    /* =========================================
       التحقق من المستخدم
    ========================================= */

    async function checkUser() {

      const {
        data: {
          user
        }
      } = await supabaseClient.auth.getUser();


      currentUser = user;


      const userName =
        document.getElementById("currentUser");


      if (!user) {

        userName.textContent =
          "يجب تسجيل الدخول للنشر";

        document.getElementById("publishBtn").disabled =
          true;

        return;

      }


      const email =
        user.email || "طالب";


      userName.textContent =
        email;

    }


    /* =========================================
       اختيار الصورة
    ========================================= */

    document
      .getElementById("imageInput")
      .addEventListener("change", function(event) {

        const file =
          event.target.files[0];


        if (!file) {
          return;
        }


        /* التأكد من نوع الصورة */

        const allowedTypes = [
          "image/jpeg",
          "image/png",
          "image/webp",
          "image/gif"
        ];


        if (!allowedTypes.includes(file.type)) {

          showMessage(
            "❌ يسمح فقط بصور JPG أو PNG أو WEBP أو GIF.",
            "error"
          );

          this.value = "";

          return;
        }


        /* الحد الأقصى 5 ميجابايت */

        if (file.size > 5 * 1024 * 1024) {

          showMessage(
            "❌ حجم الصورة يجب ألا يتجاوز 5 ميجابايت.",
            "error"
          );

          this.value = "";

          return;
        }


        selectedImage = file;


        /* معاينة */

        const reader =
          new FileReader();


        reader.onload = function(e) {

          document.getElementById(
            "previewImage"
          ).src = e.target.result;


          document.getElementById(
            "imagePreview"
          ).style.display = "block";

        };


        reader.readAsDataURL(file);

      });


    /* =========================================
       إزالة الصورة
    ========================================= */

    function removeSelectedImage() {

      selectedImage = null;

      document.getElementById(
        "imageInput"
      ).value = "";


      document.getElementById(
        "previewImage"
      ).src = "";


      document.getElementById(
        "imagePreview"
      ).style.display = "none";

    }


    /* =========================================
       نشر المنشور
    ========================================= */

    async function publishPost() {

      if (!currentUser) {

        showMessage(
          "❌ يجب تسجيل الدخول أولًا.",
          "error"
        );

        return;
      }


      const text =
        document.getElementById(
          "postText"
        ).value.trim();


      if (!text && !selectedImage) {

        showMessage(
          "⚠️ اكتب شيئًا أو أضف صورة قبل النشر.",
          "error"
        );

        return;
      }


      const publishButton =
        document.getElementById(
          "publishBtn"
        );


      publishButton.disabled = true;

      publishButton.textContent =
        "جاري النشر...";


      let imageUrl = null;


      try {

        /* =====================================
           رفع الصورة
        ===================================== */

        if (selectedImage) {

          const extension =
            selectedImage.name
              .split(".")
              .pop()
              .toLowerCase();


          const fileName =
            `${currentUser.id}/${Date.now()}-${crypto.randomUUID()}.${extension}`;


          const {
            error: uploadError
          } =
            await supabaseClient.storage
              .from(IMAGE_BUCKET)
              .upload(
                fileName,
                selectedImage,
                {
                  cacheControl: "3600",
                  upsert: false,
                  contentType: selectedImage.type
                }
              );


          if (uploadError) {
            throw uploadError;
          }


          const {
            data: publicData
          } =
            supabaseClient.storage
              .from(IMAGE_BUCKET)
              .getPublicUrl(fileName);


          imageUrl =
            publicData.publicUrl;

        }


        /* =====================================
           حفظ المنشور في قاعدة البيانات
        ===================================== */

        const {
          error: insertError
        } =
          await supabaseClient
            .from("forum_posts")
            .insert({

              user_id:
                currentUser.id,

              user_email:
                currentUser.email || "طالب",

              content:
                text,

              image_url:
                imageUrl

            });


        if (insertError) {
          throw insertError;
        }


        /* تنظيف */

        document.getElementById(
          "postText"
        ).value = "";


        removeSelectedImage();


        showMessage(
          "✅ تم نشر المنشور بنجاح.",
          "success"
        );


        await loadPosts();

      }

      catch (error) {

        console.error(error);


        showMessage(
          "❌ حدث خطأ أثناء نشر المنشور. تأكد من إعداد Supabase.",
          "error"
        );

      }


      publishButton.disabled = false;

      publishButton.textContent =
        "نشر المنشور 🚀";

    }


    /* =========================================
       تحميل المنشورات
    ========================================= */

    async function loadPosts() {

      const container =
        document.getElementById(
          "postsContainer"
        );


      container.innerHTML =
        `<div class="loading">
          جاري تحميل المنشورات...
        </div>`;


      const {
        data,
        error
      } =
        await supabaseClient
          .from("forum_posts")
          .select("*")
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        console.error(error);


        container.innerHTML =
          `<div class="empty-posts">
            ⚠️ تعذر تحميل المنشورات حاليًا.
          </div>`;

        return;
      }


      if (!data || data.length === 0) {

        container.innerHTML =
          `<div class="empty-posts">
            💬 لا توجد منشورات حتى الآن.<br>
            كن أول من يشارك سؤالًا أو معلومة!
          </div>`;

        return;
      }


      container.innerHTML = "";


      data.forEach(post => {

        const card =
          createPostElement(post);


        container.appendChild(card);

      });

    }


    /* =========================================
       إنشاء بطاقة المنشور
    ========================================= */

    function createPostElement(post) {

      const card =
        document.createElement("article");


      card.className =
        "post-card";


      const header =
        document.createElement("div");


      header.className =
        "post-header";


      const avatar =
        document.createElement("div");


      avatar.className =
        "post-avatar";


      avatar.textContent =
        "👤";


      const userBox =
        document.createElement("div");


      const author =
        document.createElement("div");


      author.className =
        "post-author";


      author.textContent =
        getSafeUserName(
          post.user_email
        );


      const date =
        document.createElement("div");


      date.className =
        "post-date";


      date.textContent =
        formatDate(
          post.created_at
        );


      userBox.appendChild(author);

      userBox.appendChild(date);


      header.appendChild(avatar);

      header.appendChild(userBox);


      card.appendChild(header);


      /* النص */

      if (post.content) {

        const content =
          document.createElement("div");


        content.className =
          "post-content";


        content.textContent =
          post.content;


        card.appendChild(content);

      }


      /* الصورة */

      if (post.image_url) {

        const image =
          document.createElement("img");


        image.className =
          "post-image";


        image.src =
          post.image_url;


        image.alt =
          "صورة مرفقة بالمنشور";


        image.loading =
          "lazy";


        card.appendChild(image);

      }


      return card;

    }


    /* =========================================
       اسم المستخدم
    ========================================= */

    function getSafeUserName(email) {

      if (!email) {
        return "طالب";
      }


      const name =
        email.split("@")[0];


      if (name.length > 20) {

        return name.substring(
          0,
          20
        );

      }


      return name;

    }


    /* =========================================
       التاريخ
    ========================================= */

    function formatDate(dateString) {

      if (!dateString) {
        return "";
      }


      const date =
        new Date(dateString);


      return date.toLocaleString(
        "ar-EG",
        {
          year: "numeric",
          month: "long",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    /* =========================================
       الرسائل
    ========================================= */

    function showMessage(
      text,
      type
    ) {

      const message =
        document.getElementById(
          "message"
        );


      message.textContent =
        text;


      message.className =
        `message ${type}`;


      setTimeout(() => {

        message.className =
          "message";

      }, 5000);

    }


    /* =========================================
       القائمة الجانبية
    ========================================= */

    function toggleForumSidebar() {

      const sidebar =
        document.getElementById(
          "forumSidebar"
        );


      if (sidebar) {
        sidebar.classList.toggle(
          "open"
        );
      }

    }


    /* =========================================
       الوضع الليلي
    ========================================= */

    function toggleDarkMode() {

      document.body.classList.toggle(
        "dark-mode"
      );


      localStorage.setItem(
        "darkMode",
        document.body.classList.contains(
          "dark-mode"
        )
          ? "on"
          : "off"
      );

    }


    function loadDarkMode() {

      if (
        localStorage.getItem(
          "darkMode"
        ) === "on"
      ) {

        document.body.classList.add(
          "dark-mode"
        );

      }

    }


    /* =========================================
       تشغيل الصفحة
    ========================================= */

    document.addEventListener(
      "DOMContentLoaded",
      async function() {

        loadDarkMode();

        await checkUser();

        await loadPosts();

      }
    );


    /* تحديث عند تسجيل الدخول */
    supabaseClient.auth.onAuthStateChange(
      async function(event, session) {

        currentUser =
          session?.user || null;


        await checkUser();

      }
    );

  </script>

</body>
</html>
