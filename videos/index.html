<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>الفيديوهات | منصة أرض الأحياء</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      background: #f4f7f6;
      color: #17221d;
    }

    header {
      background: #073b2a;
      color: white;
      padding: 16px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 21px;
      font-weight: bold;
    }

    .student {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logout {
      border: none;
      background: #c0392b;
      color: white;
      padding: 8px 12px;
      border-radius: 7px;
      cursor: pointer;
    }

    .layout {
      display: flex;
      min-height: calc(100vh - 65px);
    }

    aside {
      width: 230px;
      background: white;
      padding: 20px 12px;
      border-left: 1px solid #ddd;
    }

    .side-link {
      display: block;
      text-decoration: none;
      color: #333;
      padding: 12px;
      margin-bottom: 7px;
      border-radius: 9px;
    }

    .side-link:hover,
    .active {
      background: #e7f5ef;
      color: #075c40;
      font-weight: bold;
    }

    main {
      flex: 1;
      max-width: 1200px;
      margin: auto;
      padding: 30px;
      width: 100%;
    }

    .page-title {
      background: linear-gradient(135deg, #08794f, #0b9b68);
      color: white;
      padding: 25px;
      border-radius: 16px;
      margin-bottom: 25px;
    }

    .page-title h1 {
      margin-bottom: 8px;
    }

    .search {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 15px;
      outline: none;
    }

    .content-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .content-card {
      background: white;
      border-radius: 15px;
      padding: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
      border: 1px solid #e3e8e5;
    }

    .content-card h3 {
      color: #075c40;
      margin: 12px 0 8px;
    }

    .content-card p {
      color: #666;
      line-height: 1.7;
      margin-bottom: 12px;
    }

    video,
    .image-preview {
      width: 100%;
      border-radius: 10px;
      max-height: 400px;
      object-fit: contain;
      background: #111;
    }

    .open-btn {
      display: inline-block;
      background: #08794f;
      color: white;
      text-decoration: none;
      padding: 9px 13px;
      border-radius: 8px;
      margin-top: 5px;
    }

    .empty {
      background: white;
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      color: #777;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #075c40;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    @media (max-width: 800px) {

      .layout {
        display: block;
      }

      aside {
        width: 100%;
        border-left: none;
        border-bottom: 1px solid #ddd;
        padding: 10px;
      }

      .side-link {
        display: inline-block;
        padding: 8px;
        font-size: 13px;
      }

      main {
        padding: 18px;
      }

      .content-grid {
        grid-template-columns: 1fr;
      }

      .brand {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="brand">
    🧬 منصة أرض الأحياء
  </div>

  <div class="student">

    <span id="studentName">
      الطالب
    </span>

    <button
      class="logout"
      onclick="logout()"
    >
      خروج
    </button>

  </div>

</header>


<div class="layout">

  <aside>

    <a
      href="../index.html"
      class="side-link"
    >
      🏠 الرئيسية
    </a>

    <a
      href="index.html"
      class="side-link active"
    >
      🎥 الفيديوهات
    </a>

    <a
      href="#"
      class="side-link"
      onclick="return false;"
    >
      💬 المنتدى
    </a>

    <a
      href="../notes/index.html"
      class="side-link"
    >
      📚 المذكرات
    </a>

  </aside>


  <main>

    <section class="page-title">

      <h1>
        🎥 فيديوهات الأحياء
      </h1>

      <p>
        المحاضرات والدروس والمحتوى التعليمي
      </p>

    </section>


    <input
      type="search"
      id="search"
      class="search"
      placeholder="🔎 ابحث عن فيديو..."
      oninput="filterContent()"
    >


    <div id="loading" class="loading">
      جاري تحميل المحتوى...
    </div>


    <div
      id="contentGrid"
      class="content-grid"
    ></div>


    <footer>
      🧬 منصة أرض الأحياء
    </footer>

  </main>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    "https://gvehygqxjqucxwussaye.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_0Hxtm1KuZQ7paMyZQwRLQQ_NQ2wRaRX";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  let allContent = [];


  /* =========================
     CHECK LOGIN
  ========================= */

  async function checkUser() {

    const {
      data,
      error
    } = await supabaseClient.auth.getUser();


    if (error || !data.user) {

      window.location.href =
        "../index.html";

      return;

    }


    const user = data.user;


    const name =
      user.user_metadata?.name ||
      user.user_metadata?.full_name ||
      user.email?.split("@")[0] ||
      "الطالب";


    document.getElementById(
      "studentName"
    ).textContent =
      "👤 " + name;


    loadContent();

  }


  /* =========================
     LOAD CONTENT
  ========================= */

  async function loadContent() {

    const {
      data,
      error
    } = await supabaseClient
      .from("content")
      .select("*")
      .in("type", ["video", "image"])
      .order("created_at", {
        ascending: false
      });


    document.getElementById(
      "loading"
    ).style.display = "none";


    if (error) {

      console.error(error);

      document.getElementById(
        "contentGrid"
      ).innerHTML =
        '<div class="empty">حدث خطأ أثناء تحميل المحتوى.</div>';

      return;

    }


    allContent = data || [];

    displayContent(allContent);

  }


  /* =========================
     DISPLAY
  ========================= */

  function displayContent(items) {

    const grid =
      document.getElementById(
        "contentGrid"
      );


    grid.innerHTML = "";


    if (!items.length) {

      grid.innerHTML =
        '<div class="empty">لا توجد فيديوهات أو صور حتى الآن.</div>';

      return;

    }


    items.forEach(item => {

      const card =
        document.createElement("div");

      card.className =
        "content-card";


      let media = "";


      if (item.type === "video") {

        media = `
          <video controls preload="metadata">
            <source
              src="${item.file_url}"
              type="video/mp4"
            >
            المتصفح لا يدعم تشغيل الفيديو.
          </video>
        `;

      }


      else if (item.type === "image") {

        media = `
          <img
            src="${item.file_url}"
            class="image-preview"
            alt="${escapeHtml(item.title)}"
          >
        `;

      }


      card.innerHTML = `

        ${media}

        <h3>
          ${escapeHtml(item.title)}
        </h3>

        <p>
          ${escapeHtml(item.description || "")}
        </p>

        <a
          href="${item.file_url}"
          target="_blank"
          rel="noopener"
          class="open-btn"
        >
          🔗 فتح
        </a>

      `;


      grid.appendChild(card);

    });

  }


  /* =========================
     SEARCH
  ========================= */

  function filterContent() {

    const search =
      document.getElementById(
        "search"
      ).value
       .trim()
       .toLowerCase();


    const filtered =
      allContent.filter(item => {

        const title =
          (item.title || "")
          .toLowerCase();

        const description =
          (item.description || "")
          .toLowerCase();


        return (
          title.includes(search) ||
          description.includes(search)
        );

      });


    displayContent(filtered);

  }


  /* =========================
     ESCAPE
  ========================= */

  function escapeHtml(text) {

    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================
     LOGOUT
  ========================= */

  async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href =
      "../index.html";

  }


  checkUser();

</script>

</body>
</html>
